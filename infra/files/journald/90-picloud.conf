# Managed by PiCloud infra (infra/modules/70-logging.sh). Local edits are overwritten.
# journald applies drop-ins in name order and the last value wins; "90-" sorts
# after vendor drop-ins (some Raspberry Pi OS images ship one that sets
# Storage=volatile).
[Journal]
# Keep logs across reboots, but cap disk use and age to spare the SD card.
Storage=persistent
Compress=yes
SystemMaxUse=200M
MaxRetentionSec=2week
