# Managed by PiCloud infra (infra/modules/20-ssh.sh). Local edits are overwritten.
#
# Why "10-": Debian's /etc/ssh/sshd_config starts with
#     Include /etc/ssh/sshd_config.d/*.conf
# and sshd keeps the FIRST value it reads for most keywords. A low-numbered
# drop-in is read before other drop-ins (e.g. cloud-init's 50-cloud-init.conf)
# and before the body of sshd_config, so the values below win.

Port {{SSH_PORT}}

# Keys only, no root, one named login user.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers {{ADMIN_USER}}
MaxAuthTries 3
LoginGraceTime 30

# Drop sessions whose client stopped answering for 10 minutes (300 s x 2).
ClientAliveInterval 300
ClientAliveCountMax 2

# Forwarding: local TCP (-L) only, so Prometheus on 127.0.0.1:9090 is reachable
# through an SSH tunnel. Remote (-R) forwards could expose services to the
# Pi's network, and agent/X11/socket forwarding is not needed on a server.
AllowTcpForwarding local
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no

# Log the key fingerprint of each login.
LogLevel VERBOSE

# Modern algorithms only. The lists are filtered against `ssh -Q` at install
# time, so this file never names an algorithm the local OpenSSH lacks.
# ChaCha20 is first: the Pi 4 CPU has no AES instructions.
KexAlgorithms {{SSH_KEX_ALGORITHMS}}
Ciphers {{SSH_CIPHERS}}
MACs {{SSH_MACS}}
HostKeyAlgorithms {{SSH_HOSTKEY_ALGORITHMS}}
