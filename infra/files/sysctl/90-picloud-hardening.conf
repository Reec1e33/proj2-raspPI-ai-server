# Managed by PiCloud infra (infra/modules/80-sysctl.sh). Local edits are overwritten.
# verify.sh checks every key in this file against the running kernel.
#
# net.ipv4.ip_forward is NOT set here on purpose: Docker turns it on and needs
# it for container networking. Do not disable forwarding on this host.

# Anti-spoofing: drop packets whose source address is not routable back
# through the interface they arrived on.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects and do not send them (this host is not a router).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Refuse source-routed packets.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# SYN-flood protection, log impossible ("martian") addresses, ignore
# broadcast pings and bogus ICMP errors.
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Hide kernel pointers and the kernel log from unprivileged users.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# No unprivileged eBPF; harden the BPF JIT. The leading "-" tells
# systemd-sysctl to skip the key on kernels built without a BPF JIT.
kernel.unprivileged_bpf_disabled = 1
-net.core.bpf_jit_harden = 2

# Block link-based attacks in world-writable directories; no core dumps of
# setuid programs.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.suid_dumpable = 0
