# Common reverse-proxy settings for the api and grafana upstreams.
proxy_http_version 1.1;
proxy_set_header Connection "";
# Upstreams are on the local Docker network: fail fast if a container is down.
proxy_connect_timeout 5s;

# $http_host keeps the client's port: Grafana's CSRF check compares Origin with Host.
proxy_set_header Host $http_host;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Real-IP $remote_addr;
# The gateway is the edge: overwrite (never append to) any client-supplied value.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;

# Stream responses straight through: required for SSE, and it keeps large
# Grafana bundles out of /tmp (a small tmpfs).
proxy_buffering off;
