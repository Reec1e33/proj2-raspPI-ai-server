# Response headers for every HTTPS response.
#
# nginx drops inherited add_header directives in any block that declares its
# own, so each such location includes this file again.
#
# No Content-Security-Policy or X-Frame-Options here: Grafana sends its own,
# and a second copy would conflict. The SPA location adds a strict CSP.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
