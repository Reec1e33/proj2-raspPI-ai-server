# PiCloud gateway: global nginx settings.
#
# The image is nginx-unprivileged: the master process runs as UID 101, listens
# on 8080/8443 (compose maps host 80/443 onto them) and writes only to /tmp.
# Server blocks live in templates/picloud.conf.template.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # One JSON object per request on stdout; Alloy ships it to Loki, where
    # LogQL `| json` can parse it. request_id is also sent upstream as X-Request-ID.
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","remote_user":"$remote_user",'
        '"method":"$request_method","uri":"$request_uri","protocol":"$server_protocol",'
        '"status":$status,"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
        '"referer":"$http_referer","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 1m;

    # Emit relative Location headers so redirects never leak the internal 8080/8443 ports.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/event-stream is deliberately absent: compressing SSE would buffer the stream.
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Docker's embedded DNS. With `resolve` below, nginx starts even when an
    # upstream container is down and follows its new IP after a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Coarse per-IP guard in front of the api's own 20/minute limiter.
    limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;
    limit_req_status 429;
    # A rejected request is normal operation, not a server error: keep these
    # lines out of the "error" level that the Grafana Errors panel shows.
    limit_req_log_level warn;

    upstream api {
        zone upstream_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    upstream grafana {
        zone upstream_grafana 64k;
        server grafana:3000 resolve;
        keepalive 8;
    }

    include /etc/nginx/conf.d/*.conf;
}
