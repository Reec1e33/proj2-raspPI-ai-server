# Loki: single binary, TSDB index + filesystem chunks, sized for a Raspberry Pi.
# Started with -config.expand-env=true, so ${VAR:-default} values come from the
# container environment (see docker-compose.yml).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # A Pi produces little log volume; these caps protect it from a log storm.
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_parallelism: 2
  # Adds the detected_level structured metadata used by the dashboard's error panel.
  discover_log_levels: true
  volume_enabled: true

# Retention is enforced by the compactor, which deletes expired chunks.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
