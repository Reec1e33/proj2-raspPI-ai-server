# On a v* tag: build the pi-agent binaries, attest them, and publish a GitHub
# release with generated notes. The container images come from images.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.27.3" # same as ci.yml

jobs:
  release:
    name: pi-agent binaries and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # release builds do not restore caches from other refs

      - name: Build
        working-directory: agent
        env:
          GOTOOLCHAIN: local
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir -p ../dist
          build() { # GOARCH GOARM SUFFIX
            GOOS=linux GOARCH="$1" GOARM="$2" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "../dist/pi-agent-linux-$3" ./cmd/pi-agent
          }
          build amd64 "" amd64
          build arm64 "" arm64
          build arm 7 armv7
          # The runner is linux/amd64: check that the version string is embedded.
          test "$(../dist/pi-agent-linux-amd64 -version)" = "$version"
          cd ../dist
          sha256sum pi-agent-linux-* >SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --generate-notes --title "PiCloud ${TAG}")
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi # e.g. v2.1.0-rc.1
          gh release create "$TAG" "${flags[@]}" dist/pi-agent-linux-* dist/SHA256SUMS
