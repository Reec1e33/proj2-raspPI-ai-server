# Multi-arch container images on GHCR: ghcr.io/reec1e33/picloud-{agent,api,gateway}.
# Pushes on main and on v* tags; pull requests only build (no push).
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
    # GitHub does not evaluate path filters for tag pushes, so tags always build.
    paths:
      - "agent/**"
      - "api/**"
      - "web/**"
      - "deploy/nginx/**"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "agent/**"
      - "api/**"
      - "web/**"
      - "deploy/nginx/**"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: picloud-${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent
            context: agent
            file: agent/Dockerfile
            description: PiCloud pi-agent, Raspberry Pi host telemetry exporter (JSON snapshot and Prometheus metrics)
          - image: api
            context: api
            file: api/Dockerfile
            description: PiCloud API, FastAPI AI gateway with LLM provider fallback and live system telemetry
          - image: gateway
            context: .
            file: deploy/nginx/Dockerfile
            description: PiCloud gateway, nginx with TLS, basic auth, the web dashboard and reverse proxies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the api image runs RUN steps for the target platform; the agent and
      # the web build cross-compile on the runner's native platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Put the annotations on the multi-arch index too, so GHCR shows the description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/picloud-${{ matrix.image }} # lower-cased by the action
          flavor: latest=false
          # The highest-priority tag also becomes the version label and the agent's
          # VERSION: 2.0.0 on a tag, sha-<short> on main, pr-<n> on a pull request.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=sha,priority=300
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=picloud-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.title=picloud-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ matrix.image == 'agent' && format('VERSION={0}', steps.meta.outputs.version) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # BuildKit attestations, stored in the registry next to each platform image:
          # SLSA provenance and an SPDX SBOM (`docker buildx imagetools inspect --format`).
          provenance: mode=max
          sbom: true
