# CI for every component. A job runs only when its directory (or this file)
# changes; `ci-ok` aggregates the results and is the single required status
# check for branch protection (a skipped job counts as a pass).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # runs every job

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; keep one result per commit on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # An explicit `bash` adds `-o pipefail` to the default `-e`.
    shell: bash

env:
  # setup-go would install exactly go.mod's `go 1.27.0`; pin the latest patch so
  # govulncheck does not flag standard-library fixes that are already released.
  GO_VERSION: "1.27.3"
  STATICCHECK_VERSION: "2026.2.2" # keep in sync with agent/Makefile
  GOVULNCHECK_VERSION: "v1.9.0"
  UV_VERSION: "0.12.22" # same as the uv image in api/Dockerfile
  NODE_VERSION: "22"
  SHELLCHECK_VERSION: "v0.11.0"
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 # linux.x86_64.tar.xz
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # linux_amd64.tar.gz

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files of a PR through the API
    outputs:
      # A skipped filter (workflow_dispatch) leaves the output empty: run everything.
      agent: ${{ steps.filter.outputs.agent || 'true' }}
      api: ${{ steps.filter.outputs.api || 'true' }}
      web: ${{ steps.filter.outputs.web || 'true' }}
      infra: ${{ steps.filter.outputs.infra || 'true' }}
      deploy: ${{ steps.filter.outputs.deploy || 'true' }}
      stack: ${{ steps.filter.outputs.stack || 'true' }}
      workflows: ${{ steps.filter.outputs.workflows || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            agent:
              - 'agent/**'
              - '.github/workflows/ci.yml'
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'deploy/scripts/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            stack:
              - 'agent/**'
              - 'api/**'
              - 'web/**'
              - 'deploy/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'

  agent:
    name: agent (Go)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    env:
      GOTOOLCHAIN: local # fail if go.mod needs a newer Go than GO_VERSION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: Test (race detector, coverage)
        run: |
          go test -race -coverprofile=coverage.out ./...
          total="$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')"
          echo "agent: total statement coverage ${total}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cross-build for the Raspberry Pi (linux/arm64, linux/arm/v7)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/pi-agent
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/pi-agent
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  api:
    name: api (Python)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: api
      - name: Install (fails if uv.lock does not match pyproject.toml)
        run: uv sync --locked
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github
      - name: ruff format
        run: uv run --no-sync ruff format --check
      - name: mypy (strict)
        run: uv run --no-sync mypy
      - name: pytest (coverage gate from pyproject.toml)
        run: uv run --no-sync pytest

  web:
    name: web (TypeScript)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json # pnpm version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test --run
      - name: Build
        run: pnpm build

  infra:
    name: infra (Bash)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >>"$GITHUB_PATH"
      - name: ShellCheck (infra/ and deploy/scripts/)
        run: |
          shellcheck --version
          shellcheck -x -S style \
            infra/bootstrap.sh infra/verify.sh infra/lib/*.sh infra/modules/*.sh infra/tests/*.sh \
            deploy/scripts/*.sh
      - name: Unit tests
        run: bash infra/tests/run.sh

  deploy:
    name: deploy (config)
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose config (Pi stack and laptop override)
        working-directory: deploy
        run: |
          docker compose version
          docker compose -f docker-compose.yml --env-file .env.example config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.example config --quiet
      - name: Read the pinned image tags from the compose file
        id: images
        working-directory: deploy
        run: |
          config="$(docker compose -f docker-compose.yml --env-file .env.example config --format json)"
          for service in prometheus loki alloy; do
            echo "${service}=$(jq -r --arg s "$service" '.services[$s].image' <<<"$config")" | tee -a "$GITHUB_OUTPUT"
          done
      - name: promtool (config, rules, rule unit tests)
        working-directory: deploy/prometheus
        env:
          IMAGE: ${{ steps.images.outputs.prometheus }}
        run: |
          promtool() {
            docker run --rm --entrypoint promtool -v "$PWD:/etc/prometheus:ro" -w /etc/prometheus "$IMAGE" "$@"
          }
          promtool check config prometheus.yml
          promtool check rules rules/*.yml
          promtool test rules tests/*.yml
      - name: Grafana dashboards (JSON, datasource UIDs, panel IDs)
        run: |
          # UIDs provisioned in deploy/grafana/provisioning/datasources/, plus Grafana's built-in source.
          for dashboard in deploy/grafana/dashboards/*.json; do
            jq -e --argjson known '["prometheus", "loki", "-- Grafana --"]' '
              ([.. | objects | .datasource? | objects | .uid] | unique - $known) as $unknown
              | [.. | objects | select(has("gridPos")) | .id] as $ids
              | if ($unknown | length) > 0 then error("unknown datasource uid: \($unknown)")
                elif ($ids | length) != ($ids | unique | length) then error("duplicate panel id")
                else true end' "$dashboard" >/dev/null
            echo "ok: $dashboard"
          done
      - name: Alloy config (fmt, validate)
        env:
          IMAGE: ${{ steps.images.outputs.alloy }}
        run: |
          docker run --rm -v "$PWD/deploy/alloy:/etc/alloy:ro" "$IMAGE" fmt --test /etc/alloy/config.alloy
          docker run --rm -v "$PWD/deploy/alloy:/etc/alloy:ro" "$IMAGE" validate /etc/alloy/config.alloy
      - name: Loki config
        env:
          IMAGE: ${{ steps.images.outputs.loki }}
        run: |
          docker run --rm -v "$PWD/deploy/loki:/etc/loki:ro" "$IMAGE" \
            -config.file=/etc/loki/config.yml -config.expand-env=true -verify-config
      - name: Build the gateway image
        run: docker build -f deploy/nginx/Dockerfile -t picloud-gateway:ci .
      - name: nginx -t
        run: |
          deploy/scripts/gen-self-signed-cert.sh localhost
          docker run --rm -v "$PWD/deploy/nginx/certs:/etc/nginx/certs:ro" picloud-gateway:ci nginx -t

  e2e:
    name: e2e (dev stack, smoke test)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy
    env:
      # The laptop stack: demo-mode agent, no Ollama, gateway on 8080/8443.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
      SMOKE_USER: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create .env, a self-signed certificate and a basic-auth user
        run: |
          cp .env.example .env
          ./scripts/gen-self-signed-cert.sh localhost
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "SMOKE_PASSWORD=${password}" >>"$GITHUB_ENV"
          printf '%s\n' "$password" | ./scripts/create-htpasswd.sh "$SMOKE_USER"
      - name: Build the images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test through the gateway
        env:
          SMOKE_HTTP_URL: http://localhost:8080
        run: ./scripts/smoke-test.sh https://localhost:8443
      - name: Show container state and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  workflows:
    name: workflows (actionlint)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >>"$GITHUB_PATH"
      - name: actionlint (also runs ShellCheck on every run block)
        run: actionlint -color

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, agent, api, web, infra, deploy, e2e, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
